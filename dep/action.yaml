name: custom
description: for JS
inputs:
  caching:
    default: 'true'
    required: false
    description: cahing appility
outputs:
  state:
    value: ${{steps.out.outputs.cahe}}
runs:
   using: 'composite'
   steps:
    
      - name: Cache dependencies
        if: inputs.caching == 'true'
        id: cache
        uses: actions/cache@v3
        with:
          path: node_modules
          key: deps-node-modules-${{ hashFiles('**/package-lock.json') }}
      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci
        shell: bash
      - name: output
        run: |
          echo "cahe=${{inputs.caching}}" >> $GITHUB_OUTPUT
        shell: bash
        id: out
